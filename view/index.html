<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      ;(function () {
        try {
          var storedTheme = localStorage.getItem("theme") || localStorage.getItem("darkMode")
          var darkMode = storedTheme === "dark" || storedTheme === "true"
          document.documentElement.classList.toggle("dark", darkMode)
          document.querySelector('meta[name="theme-color"]').setAttribute("content", darkMode ? "#090e1a" : "#f8fafc")
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/png" href="/src/assets/images/logo.png" />
    <title>Attendance Repository</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
